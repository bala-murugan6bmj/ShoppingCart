<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creative Login Page</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px 15px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        transition: background 0.6s ease;
        overflow-x: hidden;
      }
      .circle {
        position: fixed;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        z-index: -1;
      }

      .circle1 {
        width: 250px;
        height: 250px;
        top: 5%;
        left: 8%;
      }

      .circle2 {
        width: 180px;
        height: 180px;
        bottom: 5%;
        right: 8%;
      }
      .login-card {
        width: 100%;
        max-width: 390px;
        padding: 35px;
        text-align: center;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 25px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        animation: appear 0.8s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .avatar {
        width: 75px;
        height: 75px;
        margin: auto auto 15px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 30px;
      }

      h1 {
        color: black;
        margin-bottom: 8px;
      }
      .input-group {
        position: relative;
        margin-top: 17px;
      }

      .input-group input {
        width: 100%;
        padding: 15px 42px;
        border: 3px solid black;
        border-radius: 12px;
        outline: none;
        font-size: 14px;
        transition: 0.3s;
      }

      .input-group input:focus {
        border-color: #764ba2;
        box-shadow: 0 0 10px rgba(118, 75, 162, 0.2);
      }

      .icon {
        position: absolute;
        top: 17px;
        left: 15px;
        color: black;
      }

      .toggle {
        position: absolute;
        top: 17px;
        right: 15px;
        color: black;
        cursor: pointer;
      }

      .error {
        display: block;
        color: #e63946;
        font-size: 12px;
        text-align: left;
        margin-top: 5px;
        min-height: 14px;
      }
      .login-btn {
        width: 100%;
        padding: 15px;
        margin-top: 20px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .login-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
      }

      #message {
        margin-top: 12px;
        font-size: 13px;
        font-weight: bold;
      }
      .divider {
        margin: 25px 0 20px;
        color: black;
        font-weight: bold;
        font-size: 13px;
      }

      .social-icons {
        display: flex;
        justify-content: center;
        gap: 20px;
      }

      .social-icons a {
        width: 43px;
        height: 43px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 18px;
        text-decoration: none;
        transition: 0.3s;
      }

      .social-icons a:nth-child(1) {
        background: #1877f2;
      }

      .social-icons a:nth-child(2) {
        background: #ff0000;
      }

      .social-icons a:nth-child(3) {
        background: #25d366;
      }

      .social-icons a:hover {
        transform: scale(1.15) rotate(8deg);
      }
      .color-section {
        margin-top: 28px;
      }

      .color-section p {
        font-size: 13px;
        color: black;
        font-weight: bold;
        margin-bottom: 13px;
      }

      .colors {
        display: flex;
        justify-content: center;
        gap: 13px;
      }

      .color-btn {
        width: 30px;
        height: 30px;
        border: 3px solid white;
        border-radius: 50%;
        cursor: pointer;
        outline: 1px solid black;
        transition: 0.3s;
      }
      .color-btn:hover {
        transform: scale(1.2);
      }
      .purple {
        background: linear-gradient(135deg, #667eea, #764ba2);
      }
      .blue {
        background: linear-gradient(135deg, #2193b0, #6dd5ed);
      }
      .pink {
        background: linear-gradient(135deg, #ee9ca7, #ffdde1);
      }
      .green {
        background: linear-gradient(135deg, #11998e, #38ef7d);
      }
      .orange {
        background: linear-gradient(135deg, #f7971e, #ffd200);
      }
      .footer {
        color: black;
        font-weight: bold;
        font-size: 11px;
        margin-top: 25px;
      }
    </style>
  </head>
  <body>
    <div class="background-shapes">
      <div class="circle circle1"></div>
      <div class="circle circle2"></div>
    </div>

    <div class="login-card">
      <div class="avatar">
        <i class="fa-solid fa-user"></i>
      </div>
      <h1>Login Page</h1>
      <form id="loginForm">
        <div class="input-group">
          <i class="fa-solid fa-user icon"></i>
          <input type="text" id="username" placeholder="Enter Username" />
        </div>
        <span id="userError" class="error"></span>

        <div class="input-group">
          <i class="fa-solid fa-lock icon"></i>
          <input type="password" id="password" placeholder="Enter Password" />
          <i class="fa-solid fa-eye toggle" id="togglePassword"></i>
        </div>
        <span id="passError" class="error"></span>

        <button type="submit" class="login-btn">
          Login <i class="fa-solid fa-arrow-right"></i>
        </button>

        <p id="message"></p>
      </form>

      <div class="divider">
        <span>Connect with us</span>
      </div>

      <div class="social-icons">
        <a href="https://facebook.com" target="_blank">
          <i class="fa-brands fa-facebook-f"></i>
        </a>

        <a href="https://youtube.com" target="_blank">
          <i class="fa-brands fa-youtube"></i>
        </a>

        <a href="https://whatsapp.com" target="_blank">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
      </div>
      <div class="color-section">
        <p>Change Background Color</p>
        <div class="colors">
          <button class="color-btn purple" data-color="purple"></button>
          <button class="color-btn blue" data-color="blue"></button>
          <button class="color-btn pink" data-color="pink"></button>
          <button class="color-btn green" data-color="green"></button>
          <button class="color-btn orange" data-color="orange"></button>
        </div>
      </div>
      <p class="footer">© 2026 Login Page</p>
    </div>
    <script>
      const form = document.getElementById("loginForm");
      const username = document.getElementById("username");
      const password = document.getElementById("password");
      const userError = document.getElementById("userError");
      const passError = document.getElementById("passError");
      const message = document.getElementById("message");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        userError.textContent = "";
        passError.textContent = "";
        message.textContent = "";

        let valid = true;

        if (username.value.trim() === "") {
          userError.textContent = "Please enter username!";
          username.focus();
          valid = false;
        }

        if (password.value.trim() === "") {
          passError.textContent = "Please enter password!";

          if (valid) {
            password.focus();
          }

          valid = false;
        } else if (password.value.length < 6) {
          passError.textContent = "Password must be at least 6 characters!";

          if (valid) {
            password.focus();
          }

          valid = false;
        }

        if (valid) {
          message.style.color = "green";
          message.textContent = "Login validation successful!";
          form.reset();
        }
      });
      username.addEventListener("input", function () {
        userError.textContent = "";
        message.textContent = "";
      });

      password.addEventListener("input", function () {
        passError.textContent = "";
        message.textContent = "";
      });
      const toggle = document.getElementById("togglePassword");

      toggle.addEventListener("click", function () {
        if (password.type === "password") {
          password.type = "text";
          toggle.classList.replace("fa-eye", "fa-eye-slash");
        } else {
          password.type = "password";
          toggle.classList.replace("fa-eye-slash", "fa-eye");
        }
      });
      const colorButtons = document.querySelectorAll(".color-btn");
      const backgrounds = {
        purple: "linear-gradient(135deg,#667eea,#764ba2)",
        blue: "linear-gradient(135deg,#2193b0,#6dd5ed)",
        pink: "linear-gradient(135deg,#ee9ca7,#ffdde1)",
        green: "linear-gradient(135deg,#11998e,#38ef7d)",
        orange: "linear-gradient(135deg,#f7971e,#ffd200)",
      };
      colorButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          const selectedColor = button.dataset.color;
          document.body.style.background = backgrounds[selectedColor];
        });
      });
    </script>
  </body>
</html>
