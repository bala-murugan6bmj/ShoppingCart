
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Location</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #fff5e8;
    color: #263b30;
}
.location {
    padding: 60px 7%;
}

.location h1 {
    text-align: center;
    color: #16432f;
    font-size: 36px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 35px;
}
.location-container {
    display: flex;
    gap: 30px;
    max-width: 1200px;
    margin: auto;
    align-items: stretch;
}
.address {
    flex: 1;
    padding: 30px;
    background-color: white;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
}
.address h2 {
    color: #16432f;
}
.address p {
    line-height: 1.8;
}
.map-btn {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 22px;
    background-color: #f46a35;
    color: white;
    text-decoration: none;
    border-radius: 25px;
    transition: 0.3s;
}
.map-btn:hover {
    background-color: #16432f;
    transform: translateY(-2px);
}
.map {
    flex: 1.5;
    min-width: 0;
    min-height: 350px;
    overflow: hidden;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
}
.map iframe {
    width: 100%;
    height: 100%;
    min-height: 350px;
    border: none;
    display: block;
}
@media (max-width: 768px) {
    .location-container {
        flex-direction: column;
    }

    .location h1 {
        font-size: 28px;
    }

    .map {
        min-height: 300px;
    }
}
</style>
</head>
<body>
    <section class="location" id="location">
        <h1>Visit Our Restaurant</h1>
        <p class="subtitle">Find us and enjoy delicious food!</p>
        <div class="location-container">
            <div class="address">
                <h2>📍 Our Address</h2>

                <h3>TastyBite Restaurant</h3>

                <p>
                    123 Main Road,<br>
                    Madurai, Tamil Nadu,<br>
                    India.
                </p>

                <p><strong>Opening Hours:</strong></p>
                <p>Monday - Sunday: 10 AM - 10 PM</p>

                <a
                    href="https://www.google.com/maps/search/?api=1&query=Madurai+Tamil+Nadu"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="map-btn">
                    Get Directions
                </a>
            </div>
            <div class="map">
                <iframe
                    src="https://maps.google.com/maps?q=Madurai%2C%20Tamil%20Nadu&z=13&output=embed"
                    title="Map showing Madurai, Tamil Nadu"
                    loading="lazy"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </section>
</body>
</html>
