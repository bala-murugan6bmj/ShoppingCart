<html>
<body>
<h2 id="count">0</h2>
<button id="btn">Increase</button>

<script>
    let count = 0;

    let button = document.getElementById("btn");
    let display = document.getElementById("count");

    button.addEventListener("click", function() {
        count++;
        display.innerText = count;
    });
</script>
</body>
</html>
