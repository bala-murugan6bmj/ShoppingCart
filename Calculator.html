<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Calculator</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e9edf3;
    font-family: Arial, sans-serif;
}
.calculator {
    width: 320px;
    padding: 20px;
    background: #202b3c;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}
h2 {
    color: white;
    text-align: center;
    margin-bottom: 20px;
}
#display {
    width: 100%;
    height: 65px;
    margin-bottom: 20px;
    padding: 10px;
    border: none;
    outline: none;
    border-radius: 8px;
    background: #f5f5f5;
    font-size: 28px;
    text-align: right;
}
.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}
button {
    height: 55px;
    border: none;
    border-radius: 8px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    background: #e4e8ee;
}
button:hover {
    background: #cbd3df;
}

.operator {
    background: #f5a623;
    color: white;
}
.operator:hover {
    background: #dc8c0c;
}
.clear {
    background: #e74c3c;
    color: white;
}
.delete {
    background: #607d9b;
    color: white;
}
.equal {
    grid-column: span 2;
    background: #20a36b;
    color: white;
}
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Calculator</h2>
        <input type="text" id="display" value="0" readonly>
        <div class="buttons">
            <button class="clear">AC</button>
            <button class="delete">DEL</button>
            <button class="operator">%</button>
            <button class="operator">/</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
        </div>
    </div>
<script>
    let display = document.getElementById("display");
let buttons = document.querySelectorAll(".buttons button");
let firstNumber = "";
let secondNumber = "";
let operator = "";
let result = "";
let shouldReset = false;
buttons.forEach((button) => {
    button.addEventListener("click", function() {
        let value = button.innerText;
        if (value === "AC") {
            display.value = "0";
            firstNumber = "";
            secondNumber = "";
            operator = "";
            result = "";
            shouldReset = false;

        }
        else if (value === "DEL") {
            if (display.value !== "Error") {
                display.value = display.value.slice(0, -1);
                if (display.value === "") {
                    display.value = "0";
                }
            }
        }
        else if (!isNaN(value) || value === ".") {
            if (display.value === "Error") {
                display.value = "0";
            }

            if (shouldReset) {
                display.value = "0";
                shouldReset = false;
            }

            if (value === ".") {
                if (!display.value.includes(".")) {
                    display.value += ".";
                }
            }
            else {
                if (display.value === "0") {
                    display.value = value;
                }
                else {
                    display.value += value;
                }
            }
        }

        else if (["+", "-", "*", "/", "%"].includes(value)) {
            if (display.value === "Error") return;
            if (operator && !shouldReset) {
                calculate();
            }
            firstNumber = display.value;
            operator = value;
            shouldReset = true;
        }
        else if (value === "=") {
            if (operator !== "" && !shouldReset) {
                calculate();
            }
        }
    });
});
function calculate() {
    secondNumber = display.value;
    let num1 = Number(firstNumber);
    let num2 = Number(secondNumber);
    if (operator === "+") {
        result = num1 + num2;
    }
    else if (operator === "-") {
        result = num1 - num2;
    }
    else if (operator === "*") {
        result = num1 * num2;

    }
    else if (operator === "/") {
        if (num2 === 0) {
            display.value = "Error";
            operator = "";
            shouldReset = true;
            return;
        }
        result = num1 / num2;
    }
    else if (operator === "%") {
        result = num1 % num2;
    }
    display.value = Number(result.toPrecision(12));
    firstNumber = display.value;
    operator = "";
    shouldReset = true;
}
</script>
</body>
</html>
