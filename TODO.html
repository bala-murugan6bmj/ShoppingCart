
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .input-box {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.85;
        }

        #message {
            color: #e74c3c;
            margin-top: 10px;
            min-height: 20px;
        }

        ul {
            list-style: none;
            margin-top: 20px;
        }

        li {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f4f5f9;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 10px;
        }

        .task-text {
            flex: 1;
            overflow-wrap: anywhere;
            color: #333;
        }

        .completed {
            text-decoration: line-through;
            color: #888;
        }

        .complete-btn {
            background: #27ae60;
        }

        .edit-btn {
            background: #f39c12;
        }

        .delete-btn {
            background: #e74c3c;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .counts {
            line-height: 1.8;
            color: #555;
        }

        #clearBtn {
            background: #e74c3c;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 15px;
        }

        @media (max-width: 450px) {
            .container {
                padding: 20px;
            }

            .input-box {
                flex-direction: column;
            }

            li {
                flex-wrap: wrap;
            }

            .footer {
                flex-direction: column;
                align-items: stretch;
            }

            #clearBtn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>My To-Do List</h1>

        <div class="input-box">

            <input type="text"
                   id="taskInput"
                   placeholder="Enter your task">

            <button id="addBtn">Add Task</button>

        </div>

        <p id="message"></p>

        <ul id="taskList"></ul>

        <div class="footer">

            <div class="counts">
                <p>Total Tasks: <span id="totalTasks">0</span></p>
                <p>Completed: <span id="completedTasks">0</span></p>
            </div>

            <button id="clearBtn">Clear All</button>

        </div>

    </div>

    <script>
        let taskInput = document.getElementById("taskInput");
        let addBtn = document.getElementById("addBtn");
        let taskList = document.getElementById("taskList");
        let message = document.getElementById("message");
        let totalTasks = document.getElementById("totalTasks");
        let completedTasks = document.getElementById("completedTasks");
        let clearBtn = document.getElementById("clearBtn");
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        function addTask() {
            let task = taskInput.value.trim();
            if (task === "") {
                message.innerText = "Please enter a task";
                return;
            }
            let newTask = {
                id: Date.now(),
                text: task,
                completed: false
            };
            tasks.push(newTask);
            taskInput.value = "";
            message.innerText = "";
            saveTasks();
            displayTasks();

        }
        function displayTasks() {

            taskList.innerHTML = "";

            if (tasks.length === 0) {

                let emptyMessage = document.createElement("li");
                emptyMessage.className = "empty";
                emptyMessage.textContent = "No tasks yet. Add a task!";
                taskList.appendChild(emptyMessage);
            }

            tasks.forEach(function(task) {
                let li = document.createElement("li");
                let span = document.createElement("span");

                span.textContent = task.text;
                span.className = "task-text";

                if (task.completed) {
                    span.classList.add("completed");
                }
                let completeBtn = document.createElement("button");
                completeBtn.textContent = task.completed ? "Undo" : "Complete";
                completeBtn.className = "complete-btn";
                completeBtn.addEventListener("click", function() {
                    toggleTask(task.id);

                });
                let editBtn = document.createElement("button");
                editBtn.textContent = "Edit";
                editBtn.className = "edit-btn";
                editBtn.addEventListener("click", function() {

                    editTask(task.id);
                });
                let deleteBtn = document.createElement("button");
                deleteBtn.textContent = "Delete";
                deleteBtn.className = "delete-btn";
                deleteBtn.addEventListener("click", function() {
                    deleteTask(task.id);
                });
                li.append(span, completeBtn, editBtn, deleteBtn);
                taskList.appendChild(li);
            });
            updateCount();
        }
        function toggleTask(id) {
            let task = tasks.find(function(item) {
                return item.id === id;
            });
            if (task) {
                task.completed = !task.completed;
            }
            saveTasks();
            displayTasks();
        }
        function editTask(id) {
            let task = tasks.find(function(item) {
                return item.id === id;
            });
            if (!task) return;
            let updatedTask = prompt("Edit your task:", task.text);
            if (updatedTask === null) return;
            updatedTask = updatedTask.trim();
            if (updatedTask === "") {
                alert("Task cannot be empty");
                return;
            }
            task.text = updatedTask;
            saveTasks();
            displayTasks();

        }
        function deleteTask(id) {
            tasks = tasks.filter(function(task) {
                return task.id !== id;
            });
            saveTasks();
            displayTasks();
        }
        function updateCount() {
            totalTasks.textContent = tasks.length;
            let completed = tasks.filter(function(task) {
                return task.completed === true;
            });
            completedTasks.textContent = completed.length;
        }

        function clearAll() {
            if (tasks.length === 0) return;
            let result = confirm("Are you sure you want to delete all tasks?");
            if (result) {
                tasks = [];
                saveTasks();
                displayTasks();
            }
        }
        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }
        addBtn.addEventListener("click", addTask);
        clearBtn.addEventListener("click", clearAll);
        taskInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                addTask();
            }
        });
        displayTasks();
    </script>
</body>
</html>
