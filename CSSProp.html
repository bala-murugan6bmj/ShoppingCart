<!DOCTYPE html>
<html>
<head>
    <title>Z Index Example</title>
    <style>
        .box {
            width: 150px;
            height: 100px;
            position: absolute;
            color: white;
            padding: 10px;
        }
        .red {
            background-color: red;
            top: 50px;
            left: 50px;
            z-index: 2;
        }
        .blue {
            background-color: blue;
            top: 90px;
            left: 100px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="box red">Red Box</div>
    <div class="box blue">Blue Box</div>

</body>
</html>
